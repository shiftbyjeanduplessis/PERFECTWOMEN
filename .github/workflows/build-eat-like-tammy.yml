name: Build Eat Like Tammy PDF
permissions:
  contents: write
on:
  push:
    paths:
      - 'scripts/build_eat_like_tammy.py'
      - '.github/workflows/build-eat-like-tammy.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/build_eat_like_tammy.py
      - name: Commit generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'downloads/Perfect_Women_Eat_Like_Tammy_ELEVATED-compressed.pdf'
          git diff --cached --quiet || git commit -m 'Deploy updated Eat Like Tammy PDF'
          git push
